# CI do Furin Access (T-05 e T-44, RNF08, DEC-28 G2).
# Compila, roda os testes com um MySQL 8.4 de teste e faz a análise do SonarCloud,
# com a cobertura do JaCoCo. Não publica a aplicação (DEC-31).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Só leitura do repositório: o job não precisa escrever nada no GitHub.
# O resultado do SonarCloud chega ao PR pelo aplicativo do SonarCloud, não por este job.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Só diz se o token existe; o token em si vai apenas para o passo do SonarCloud.
      # Sem o secret (por exemplo, em um PR vindo de fork), a análise é pulada.
      TEM_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: furin_test
          MYSQL_USER: furin
          MYSQL_PASSWORD: furin_test_only   # credencial descartável, exclusiva da CI
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo, usado pelo SonarCloud para achar o código novo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build e testes
        # O Maven Wrapper garante a mesma versão do Maven usada localmente.
        # O perfil test é ativado pelos próprios testes (@ActiveProfiles("test")).
        # O JaCoCo (pom.xml) grava a cobertura em target/site/jacoco/jacoco.xml.
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/furin_test
          SPRING_DATASOURCE_USERNAME: furin
          SPRING_DATASOURCE_PASSWORD: furin_test_only
      - name: Guardar os relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
      - name: Cache do SonarCloud
        if: env.TEM_SONAR_TOKEN == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Análise SonarCloud
        # Usa as classes e o relatório do JaCoCo do passo anterior (não roda os testes de novo).
        # Em um pull_request, o scanner reconhece o PR sozinho e o SonarCloud mostra o
        # quality gate no PR. Só o código-fonte é enviado, nunca o banco.
        if: env.TEM_SONAR_TOKEN == 'true'
        run: >-
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORG }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
