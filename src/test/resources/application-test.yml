# Perfil test: testes automatizados, no banco furin_test.
# Na CI, SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD
# vêm das variáveis do workflow e têm prioridade sobre este arquivo.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/furin_test
    # O Spring guarda vários contextos de teste abertos, cada um com o seu pool. Com o
    # padrão (10 conexões por pool), a soma passa do limite do MySQL ("Too many connections")
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1

furin:
  agendamentos:
    # T-29: sem a tarefa agendada nos testes. Cada contexto guardado pelo Spring teria a
    # sua, com o próprio relógio, e cancelaria as liberações de outro teste. A expiração
    # continua conferida antes de cada operação da portaria, e os testes a chamam direto
    ativos: false
