<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina('Login', '', ~{::conteudo})}">
<head>
  <!-- Só para abrir o arquivo direto no navegador: o layout monta o título de verdade -->
  <title>Login | Furin Access</title>
</head>
<body>
<th:block th:fragment="conteudo">
  <h1>Entrar no Furin Access</h1>

  <!-- A11 §5.13.8: role="status" sem mover o foco. Texto [PROP] -->
  <div role="status" class="aviso aviso--sucesso" th:if="${param.logout}">
    <p><strong>Sucesso:</strong> você saiu do sistema.</p>
  </div>

  <!--
    RF02, E1: a mesma mensagem para usuário inexistente, senha errada e conta inativa,
    sem dizer qual dado está errado (A10 §8.5; A11 §5.9.10). role="alert" anuncia a
    mensagem; o foco vai para o primeiro campo, que aponta para ela (aria-describedby).
  -->
  <div id="erro-login" role="alert" class="aviso aviso--erro" th:if="${erroCredencial}">
    <p><strong>Erro:</strong> Usuário ou senha inválidos. Confira os dados e tente novamente.</p>
  </div>

  <!--
    RF02, E2 (T-14): login bloqueado por excesso de tentativas. Igual para contas
    existentes e inexistentes, sem dizer quanto tempo falta. Não é erro de um campo:
    nenhum campo fica marcado como inválido. Texto [PROP]
  -->
  <div id="erro-bloqueio" role="alert" class="aviso aviso--erro" th:if="${erroBloqueado}">
    <p><strong>Erro:</strong> Muitas tentativas sem sucesso. Aguarde alguns minutos e tente novamente.</p>
  </div>

  <!--
    RF01; A11 §5.9.18; CA-RF01-09: autocomplete para o gerenciador de senhas e colar
    permitido (nenhum bloqueio de paste). th:action inclui o token CSRF.
    RF02 (CA-RF02-07): depois de um erro, o usuário digitado volta preenchido e a senha
    volta vazia (ela nunca é devolvida pelo servidor).
  -->
  <form th:action="@{/login}" method="post" novalidate>
    <div class="campo">
      <label for="usuario">Usuário (obrigatório)</label>
      <!-- RF02, E3: validação de preenchimento, sem consultar a conta -->
      <p id="usuario-erro" role="alert" class="campo__erro" th:if="${erroUsuarioVazio}">
        <span>Erro:</span> Informe o usuário.
      </p>
      <input id="usuario" name="username" type="text" required
             autocomplete="username" autocapitalize="none" spellcheck="false"
             th:value="${usuarioDigitado}"
             th:autofocus="${erroCredencial} or ${erroUsuarioVazio}"
             th:attr="aria-invalid=(${erroCredencial} or ${erroUsuarioVazio}) ? 'true',
                      aria-describedby=${erroCredencial} ? 'erro-login' : (${erroUsuarioVazio} ? 'usuario-erro')">
    </div>

    <div class="campo">
      <label for="senha">Senha (obrigatório)</label>
      <p id="senha-erro" role="alert" class="campo__erro" th:if="${erroSenhaVazia}">
        <span>Erro:</span> Informe a senha.
      </p>
      <input id="senha" name="password" type="password" required
             autocomplete="current-password"
             th:autofocus="${erroSenhaVazia} and not ${erroUsuarioVazio}"
             th:attr="aria-invalid=(${erroCredencial} or ${erroSenhaVazia}) ? 'true',
                      aria-describedby=${erroCredencial} ? 'erro-login' : (${erroSenhaVazia} ? 'senha-erro')">
    </div>

    <button type="submit" class="botao">Entrar</button>
  </form>
</th:block>
</body>
</html>
