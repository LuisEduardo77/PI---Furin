<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: pagina('Portaria', 'portaria', ~{::conteudo})}">
<head>
  <!-- Só para abrir o arquivo direto no navegador: o layout monta o título de verdade -->
  <title>Portaria | Furin Access</title>
</head>
<body>
<th:block th:fragment="conteudo">
  <h1>Portaria</h1>
  <!-- RF01, fluxo A1 (T-15): volta da troca obrigatória. role="status" sem mover o foco. Texto [PROP] -->
  <div role="status" class="aviso aviso--sucesso" th:if="${senhaDefinida}">
    <p><strong>Sucesso:</strong> sua nova senha foi salva.</p>
  </div>
  <p>Você entrou como <strong sec:authentication="name">ate.demo</strong>.</p>
  <p>
    A leitura da carteirinha e os painéis da portaria entram nas próximas tarefas
    do plano.
  </p>
</th:block>
</body>
</html>
